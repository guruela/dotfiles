set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf

set-option -g base-index 1
set-option -g pane-base-index 1

set-option -g mouse on

unbind '"'
unbind '%'
bind | split-window -h
bind - split-window -v

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind x kill-pane

# Status Bar Configuration
set -g @fg "#F8F8F2"
set -g @bg "#B166CC"

set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-justify absolute-centre

set -g status-left '#[bg=default,fg=default]#{?client_prefix,,  tmux  }#[bg=#{@bg},fg=#{@fg},bold]#{?client_prefix,  tmux  ,}'
set -g status-right '#S'

set -g window-status-separator ''
set -g window-status-format ' #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //"),#W} '
set -g window-status-current-format '#[bg=#{@bg},fg=#{@fg},bold] #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //"),#W} #{?window_zoomed_flag,󰊓 ,}'
